<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat | Qinamical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-chat: #efeae2;
            --whatsapp-green: #00a884;
            --msg-in: #ffffff;
            --msg-out: #d9fdd3;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        
        /* Contenedor Principal Estilo App */
        .app-container {
            max-width: 900px;
            height: 85vh;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera del Chat */
        .chat-header {
            background: var(--whatsapp-green);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Area de Mensajes con fondo tipo WhatsApp */
        #chat {
            flex: 1;
            overflow-y: auto;
            background-color: var(--bg-chat);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            padding: 20px;
            scroll-behavior: smooth;
        }

        /* Estilo de burbujas */
        .bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease;
        }
        .bubble.received {
            background: var(--msg-in);
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .bubble-meta {
            font-size: 0.7rem;
            color: #667781;
            text-align: right;
            margin-top: 4px;
        }
        .phone-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--whatsapp-green);
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center h-100 py-4">

    <div class="container app-container p-0">
        <div class="chat-header">
            <div class="d-flex align-items-center">
                <div class="rounded-circle bg-light text-primary d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px;">
                    <i class="bi bi-whatsapp fs-4"></i>
                </div>
                <div>
                    <h6 class="mb-0 fw-bold">Centro de Mensajes Qinamical</h6>
                    <small class="opacity-75"><i class="bi bi-circle-fill text-warning small me-1"></i> Actualizando en vivo</small>
                </div>
            </div>
            <div class="fs-5">
                <i class="bi bi-search me-3"></i>
                <i class="bi bi-three-dots-vertical"></i>
            </div>
        </div>

        <div id="chat" class="d-flex flex-column">
            <div class="text-center my-auto p-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-muted">Sincronizando mensajes...</p>
            </div>
        </div>

        <div class="bg-light p-3 border-top d-flex align-items-center">
            <i class="bi bi-emoji-smile fs-4 me-3 text-muted"></i>
            <div class="form-control border-0 rounded-pill bg-white text-muted">Lectura automática...</div>
            <i class="bi bi-mic-fill fs-4 ms-3 text-muted"></i>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
